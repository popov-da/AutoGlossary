[project]
name = "autoglossary"
version = "0.1.0"
description = "Open EN-RU automotive terminology base and import tools"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.12,<1",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["EXE001"]

[tool.pytest.ini_options]
testpaths = ["tests"]

name: Rebuild glossary artifacts

on:
  push:
    branches: [main]
    paths:
      - "data/**.csv"
      - "imports/**.csv"
      - "scripts/rebuild_termbase.py"
      - "scripts/export_consumer.py"
      - "scripts/sanitize_source_documents.py"
      - "scripts/validate.py"
      - ".github/workflows/rebuild-termbase.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild-export-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Sanitize committed corpus metadata
        run: python scripts/sanitize_source_documents.py

      - name: Rebuild master termbase
        run: python scripts/rebuild_termbase.py

      - name: Export consumer glossaries
        run: python scripts/export_consumer.py

      - name: Validate all CSV artifacts
        run: python scripts/validate.py

      - name: Commit generated artifacts and sanitized sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.csv imports/*.csv reports/conflicts.csv exports/consumer-*.csv
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Rebuild glossary artifacts and sanitize sources"
          git push

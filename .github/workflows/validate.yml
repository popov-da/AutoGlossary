name: Validate glossary pipeline

on:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project
        run: pip install -e .[dev]

      - name: Lint
        run: ruff check scripts tests

      - name: Test
        run: pytest

      - name: Rebuild master termbase
        run: python scripts/rebuild_termbase.py

      - name: Export consumer glossaries
        run: python scripts/export_consumer.py

      - name: Validate all CSV artifacts
        run: python scripts/validate.py

      - name: Verify generated artifacts are committed
        run: git diff --exit-code -- data/termbase.csv reports/conflicts.csv exports/consumer-*.csv

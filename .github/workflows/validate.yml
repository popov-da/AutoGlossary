name: Validate glossary pipeline

on:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install development tools
        run: python -m pip install "pytest>=8,<9" "ruff>=0.12,<1"

      - name: Lint
        run: ruff check scripts tests

      - name: Test
        run: pytest

      - name: Sanitize corpus metadata
        run: python scripts/sanitize_source_documents.py

      - name: Rebuild master termbase
        run: python scripts/rebuild_termbase.py

      - name: Export consumer glossaries
        run: python scripts/export_consumer.py

      - name: Validate all CSV artifacts
        run: python scripts/validate.py

      - name: Verify generated artifacts and sanitized sources are committed
        run: git diff --exit-code -- data/*.csv imports/*.csv reports/conflicts.csv exports/consumer-*.csv

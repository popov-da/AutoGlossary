name: Validate termbase

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: pip install -e .[dev]
      - name: Lint
        run: ruff check scripts tests
      - name: Test
        run: pytest
      - name: Validate termbase
        if: ${{ hashFiles('data/termbase.csv') != '' }}
        run: python scripts/validate.py data/termbase.csv
